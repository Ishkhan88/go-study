services:

  postgres:
    image: postgres:15
    container_name: concert_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: concertdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: concert_rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"

  auth-service:
    build:
      context: ..
      dockerfile: auth/Dockerfile
    container_name: auth_service
    restart: always
    ports:
      - "8081:8081"
    depends_on:
      - postgres
    env_file:
      - ../.env

  concert-service:
    build:
      context: ..
      dockerfile: concert/Dockerfile
    container_name: concert_service
    restart: always
    ports:
      - "8082:8082"
    depends_on:
      - postgres
      - rabbitmq
    env_file:
      - ../.env

  notification-service:
    build:
      context: ..
      dockerfile: notification/Dockerfile
    container_name: notification_service
    restart: always
    depends_on:
      - postgres
      - rabbitmq
    env_file:
      - ../.env

volumes:
  postgres_data: