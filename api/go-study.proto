syntax = "proto3";

package gostudy.v1;

option go_package = "github.com/Ishkhan88/go-study/gostudy/v1;gostudyv1";

//import "google/protobuf/empty.proto";//
import "google/protobuf/timestamp.proto";

// --------------------
// Common
// --------------------

message IdRequest {
  int64 id = 1;
}

message DeleteResponse {
  bool deleted = 1;
  int64 id = 2;
}

// (Можно потом добавить page/page_size, фильтры и т.д.)
message ListRequest {}

// --------------------
// User
// --------------------

message User {
  int64 id = 1;
  string first_name = 2;
  string last_name = 3;
  string email = 4;
  string phone = 5;
  string avatar_url = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message CreateUserRequest {
  User user = 1;
}

message UpdateUserRequest {
  int64 id = 1;
  User user = 2;
}

message UserResponse {
  User user = 1;
}

message ListUsersResponse {
  repeated User users = 1;
}

// --------------------
// Concert
// --------------------

message Concert {
  int64 id = 1;
  string title = 2;
  google.protobuf.Timestamp date = 3;
  string location = 4;
  double ticket_price = 5;
  int64 tickets_total = 6;
  int64 tickets_left = 7;
  string organizer_email = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}

message CreateConcertRequest {
  Concert concert = 1;
}

message UpdateConcertRequest {
  int64 id = 1;
  Concert concert = 2;
}

message ConcertResponse {
  Concert concert = 1;
}

message ListConcertsResponse {
  repeated Concert concerts = 1;
}

// --------------------
// Booking
// --------------------

message Booking {
  int64 id = 1;
  int64 user_id = 2;
  int64 concert_id = 3;
  string status = 4; // pending/confirmed/rejected
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message CreateBookingRequest {
  Booking booking = 1;
}

message UpdateBookingRequest {
  int64 id = 1;
  Booking booking = 2;
}

message BookingResponse {
  Booking booking = 1;
}

message ListBookingsResponse {
  repeated Booking bookings = 1;
}

// --------------------
// Notification
// --------------------

message Notification {
  int64 id = 1;
  int64 concert_id = 2;
  int64 user_id = 3;
  string status = 4; // success/failed
  google.protobuf.Timestamp sent_at = 5;
}

message CreateNotificationRequest {
  Notification notification = 1;
}

message UpdateNotificationRequest {
  int64 id = 1;
  Notification notification = 2;
}

message NotificationResponse {
  Notification notification = 1;
}

message ListNotificationsResponse {
  repeated Notification notifications = 1;
}

// --------------------
// Services
// --------------------

service UsersService {
  rpc Create(CreateUserRequest) returns (UserResponse);
  rpc Update(UpdateUserRequest) returns (UserResponse);
  rpc Delete(IdRequest) returns (DeleteResponse);
  rpc Get(IdRequest) returns (UserResponse);
  rpc List(ListRequest) returns (ListUsersResponse);
}

service ConcertsService {
  rpc Create(CreateConcertRequest) returns (ConcertResponse);
  rpc Update(UpdateConcertRequest) returns (ConcertResponse);
  rpc Delete(IdRequest) returns (DeleteResponse);
  rpc Get(IdRequest) returns (ConcertResponse);
  rpc List(ListRequest) returns (ListConcertsResponse);
}

service BookingsService {
  rpc Create(CreateBookingRequest) returns (BookingResponse);
  rpc Update(UpdateBookingRequest) returns (BookingResponse);
  rpc Delete(IdRequest) returns (DeleteResponse);
  rpc Get(IdRequest) returns (BookingResponse);
  rpc List(ListRequest) returns (ListBookingsResponse);
}

service NotificationsService {
  rpc Create(CreateNotificationRequest) returns (NotificationResponse);
  rpc Update(UpdateNotificationRequest) returns (NotificationResponse);
  rpc Delete(IdRequest) returns (DeleteResponse);
  rpc Get(IdRequest) returns (NotificationResponse);
  rpc List(ListRequest) returns (ListNotificationsResponse);
}
